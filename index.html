<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cobranza</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; display: flex; justify-content: space-between; align-items: center; border-radius: 15px 15px 0 0; }
        .header h1 { font-size: 28px; }
        .btn { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #5568d3; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-info { background: #17a2b8; }
        .btn-small { padding: 6px 12px; font-size: 14px; margin: 2px; }
        .login-box { max-width: 450px; margin: 80px auto; padding: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .dashboard { padding: 30px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 12px; }
        .stat-card h3 { font-size: 14px; margin-bottom: 10px; opacity: 0.9; }
        .stat-card .value { font-size: 32px; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 12px 24px; background: #e9ecef; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .tab.active { background: #667eea; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: #667eea; color: white; padding: 12px; text-align: left; font-size: 14px; }
        td { padding: 10px 12px; border-bottom: 1px solid #ddd; font-size: 14px; }
        tr:hover { background: #f8f9fa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 20px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .badge-info { background: #d1ecf1; color: #0c5460; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .info-item { background: #f8f9fa; padding: 12px; border-radius: 8px; }
        .info-label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
        .info-value { font-size: 16px; font-weight: 600; color: #333; }
        .search-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .loading { text-align: center; padding: 40px; color: #667eea; font-size: 18px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">⏳ Cargando sistema...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        console.log('🚀 Iniciando sistema...');
        
        const SUPABASE_URL = 'https://awioaqlvkspzmjnqtndt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3aW9hcWx2a3Nwem1qbnF0bmR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2NTYwNzIsImV4cCI6MjA3NjIzMjA3Mn0.uqvo-SpAm_o4bdDBW3HBuMvr2QDpaVrRkXogcL9AbCo';
        
        let supabase;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log('✅ Supabase conectado');
        } catch (error) {
            console.error('❌ Error al conectar con Supabase:', error);
            document.getElementById('app').innerHTML = '<div class="container"><div class="login-box"><h2 style="color:red;">Error al conectar con Supabase</h2><p>' + error.message + '</p></div></div>';
        }

        const DATA = {
            currentUser: null,
            clientes: [],
            prestamos: [],
            cobros: [],
            searchTerm: '',
            loading: false
        };

        async function cargarDatos() {
            DATA.loading = true;
            render();
            
            try {
                const { data: clientes, error: errorClientes } = await supabase
                    .from('clientes')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (errorClientes) throw errorClientes;
                DATA.clientes = clientes || [];

                const { data: prestamos, error: errorPrestamos } = await supabase
                    .from('prestamos')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (errorPrestamos) throw errorPrestamos;
                DATA.prestamos = prestamos || [];

                const { data: cobros, error: errorCobros } = await supabase
                    .from('cobros')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (errorCobros) throw errorCobros;
                DATA.cobros = cobros || [];

            } catch (error) {
                console.error('Error al cargar datos:', error);
                alert('Error: ' + error.message);
            } finally {
                DATA.loading = false;
                render();
            }
        }

        function contarDiasHabiles(fechaInicio, fechaFin) {
            let inicio = new Date(fechaInicio);
            let fin = new Date(fechaFin);
            let dias = 0;
            while (inicio <= fin) {
                if (inicio.getDay() !== 0) dias++;
                inicio.setDate(inicio.getDate() + 1);
            }
            return dias;
        }

        function calcularDiasAtraso(prestamo) {
            const hoy = new Date();
            const fechaPrestamo = new Date(prestamo.fecha_inicio);
            const diasTranscurridos = contarDiasHabiles(fechaPrestamo, hoy);
            const diasPagados = Math.floor(prestamo.cobrado / prestamo.cuota_diaria);
            return Math.max(0, diasTranscurridos - diasPagados);
        }

        async function login(e) {
            e.preventDefault();
            const form = e.target;
            const username = form.username.value;
            const password = form.password.value;
            const role = form.role.value;
            
            DATA.loading = true;
            render();

            try {
                const { data: usuarios, error } = await supabase
                    .from('usuarios')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .eq('role', role)
                    .single();
                
                if (error || !usuarios) {
                    alert('Usuario, contraseña o rol incorrectos');
                    DATA.loading = false;
                    render();
                    return;
                }

                DATA.currentUser = usuarios;
                await cargarDatos();
            } catch (error) {
                console.error('Error:', error);
                alert('Error al iniciar sesión');
                DATA.loading = false;
                render();
            }
        }

        function logout() {
            DATA.currentUser = null;
            DATA.clientes = [];
            DATA.prestamos = [];
            DATA.cobros = [];
            render();
        }

        async function addCliente(e) {
            e.preventDefault();
            const form = e.target;
            
            const nuevoCliente = {
                nombre: form.nombre.value,
                documento: form.documento.value,
                telefono: form.telefono.value,
                direccion: form.direccion.value,
                cobrador: DATA.currentUser.username,
                cobrador_nombre: DATA.currentUser.nombre
            };

            try {
                const { data, error } = await supabase
                    .from('clientes')
                    .insert([nuevoCliente])
                    .select();
                
                if (error) throw error;
                
                // Agregar el cliente al array local INMEDIATAMENTE
                DATA.clientes.push(data[0]);
                
                closeModal();
                
                setTimeout(function() {
                    if (confirm('Cliente guardado. ¿Crear préstamo para ' + nuevoCliente.nombre + '?')) {
                        showModal('prestamo', data[0].id);
                    } else {
                        render();
                    }
                }, 200);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteCliente(id) {
            if (confirm('¿Eliminar este cliente?')) {
                try {
                    await supabase.from('clientes').delete().eq('id', id);
                    await cargarDatos();
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        }

        async function addPrestamo(e) {
            e.preventDefault();
            const form = e.target;
            const monto = parseFloat(form.monto.value);
            const plazo = parseInt(form.plazo.value);
            const total = monto * 1.20;
            const cuotaDiaria = total / plazo;
            const clienteId = parseInt(form.cliente.value);
            const cliente = DATA.clientes.find(c => c.id === clienteId);

            const nuevoPrestamo = {
                cliente_id: clienteId,
                cliente_nombre: cliente.nombre,
                monto: monto,
                total: total,
                plazo: plazo,
                cuota_diaria: cuotaDiaria,
                cobrado: 0,
                pendiente: total,
                fecha_inicio: new Date().toISOString().split('T')[0],
                fecha_inicio_display: new Date().toLocaleDateString('es-CO'),
                cobrador: DATA.currentUser.username,
                cobrador_nombre: DATA.currentUser.nombre,
                activo: true
            };

            try {
                await supabase.from('prestamos').insert([nuevoPrestamo]);
                closeModal();
                await cargarDatos();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function addCobro(e) {
            e.preventDefault();
            const form = e.target;
            const prestamoId = parseInt(form.prestamoId.value);
            const monto = parseFloat(form.monto.value);
            const observaciones = form.observaciones.value;
            const prestamo = DATA.prestamos.find(p => p.id === prestamoId);

            if (monto > prestamo.pendiente) {
                alert('El monto no puede ser mayor al pendiente');
                return;
            }

            const nuevoCobro = {
                prestamo_id: prestamoId,
                cliente_nombre: prestamo.cliente_nombre,
                monto: monto,
                fecha: new Date().toLocaleString('es-CO'),
                cobrador: DATA.currentUser.username,
                cobrador_nombre: DATA.currentUser.nombre,
                observaciones: observaciones
            };

            const nuevoPendiente = prestamo.pendiente - monto;
            const nuevoCobrado = prestamo.cobrado + monto;

            try {
                await supabase.from('cobros').insert([nuevoCobro]);
                await supabase.from('prestamos').update({
                    cobrado: nuevoCobrado,
                    pendiente: nuevoPendiente,
                    activo: nuevoPendiente > 0
                }).eq('id', prestamoId);

                closeModal();
                await cargarDatos();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function showModal(type, data) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            
            if (type === 'cliente') {
                content.innerHTML = '<h2>Nuevo Cliente</h2><form onsubmit="addCliente(event)"><div class="form-group"><label>Nombre</label><input name="nombre" required></div><div class="form-group"><label>Documento</label><input name="documento" required></div><div class="form-group"><label>Teléfono</label><input name="telefono" required></div><div class="form-group"><label>Dirección</label><input name="direccion" required></div><button type="submit" class="btn">Guardar</button> <button type="button" class="btn btn-danger" onclick="closeModal()">Cancelar</button></form>';
            } else if (type === 'prestamo') {
                const clientes = getClientesFiltrados();
                const clientePreseleccionado = data || '';
                let optionsHTML = '<option value="">Seleccionar</option>';
                for (let i = 0; i < clientes.length; i++) {
                    const c = clientes[i];
                    const selected = c.id === clientePreseleccionado ? ' selected' : '';
                    optionsHTML += '<option value="' + c.id + '"' + selected + '>' + c.nombre + '</option>';
                }
                content.innerHTML = '<h2>Nuevo Préstamo</h2><form onsubmit="addPrestamo(event)"><div class="form-group"><label>Cliente</label><select name="cliente" required>' + optionsHTML + '</select></div><div class="form-group"><label>Monto</label><input type="number" name="monto" min="1000" required></div><div class="form-group"><label>Plazo (días)</label><input type="number" name="plazo" min="1" value="30" required></div><button type="submit" class="btn">Guardar</button> <button type="button" class="btn btn-danger" onclick="closeModal()">Cancelar</button></form>';
            } else if (type === 'cobro') {
                const p = data;
                const diasPagados = Math.floor(p.cobrado / p.cuota_diaria);
                content.innerHTML = '<h2>Registrar Cobro</h2><div class="info-grid"><div class="info-item"><span class="info-label">Cliente</span><span class="info-value">' + p.cliente_nombre + '</span></div><div class="info-item"><span class="info-label">Pendiente</span><span class="info-value">$' + p.pendiente.toLocaleString() + '</span></div></div><form onsubmit="addCobro(event)"><input type="hidden" name="prestamoId" value="' + p.id + '"><div class="form-group"><label>Monto</label><input type="number" name="monto" min="1" value="' + Math.round(p.cuota_diaria) + '" required></div><div class="form-group"><label>Observaciones</label><textarea name="observaciones" rows="3"></textarea></div><button type="submit" class="btn btn-success">Registrar</button> <button type="button" class="btn btn-danger" onclick="closeModal()">Cancelar</button></form>';
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            if (modal) modal.classList.remove('active');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const tabBtn = document.querySelector('[data-tab="' + tab + '"]');
            const tabCnt = document.getElementById('tab-' + tab);
            if (tabBtn) tabBtn.classList.add('active');
            if (tabCnt) tabCnt.classList.add('active');
        }

        function getClientesFiltrados() {
            if (DATA.currentUser.role === 'cobrador') {
                return DATA.clientes.filter(c => c.cobrador === DATA.currentUser.username);
            }
            return DATA.clientes;
        }

        function getPrestamosFiltrados() {
            let filtered = DATA.prestamos.filter(p => p.activo);
            if (DATA.currentUser.role === 'cobrador') {
                filtered = filtered.filter(p => p.cobrador === DATA.currentUser.username);
            }
            
            if (DATA.searchTerm) {
                const term = DATA.searchTerm.toLowerCase();
                filtered = filtered.filter(p => 
                    p.cliente_nombre.toLowerCase().includes(term) ||
                    p.id.toString().includes(term) ||
                    p.monto.toString().includes(term)
                );
            }
            
            return filtered;
        }

        function getCobrosFiltrados() {
            if (DATA.currentUser.role === 'cobrador') {
                return DATA.cobros.filter(c => c.cobrador === DATA.currentUser.username);
            }
            return DATA.cobros;
        }

        function updateSearch(value) {
            DATA.searchTerm = value;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (DATA.loading) {
                app.innerHTML = '<div class="loading">Cargando...</div>';
                return;
            }
            
            if (!DATA.currentUser) {
                app.innerHTML = '<div class="container"><div class="header"><h1>🏦 Sistema de Cobranza</h1></div><div class="login-box"><h2 style="text-align:center;margin-bottom:30px;">Iniciar Sesión</h2><form onsubmit="login(event)"><div class="form-group"><label>Usuario</label><input name="username" required></div><div class="form-group"><label>Contraseña</label><input type="password" name="password" required></div><div class="form-group"><label>Rol</label><select name="role" required><option value="">Seleccionar</option><option value="cobrador">Cobrador</option><option value="administrador">Administrador</option><option value="gerente">Gerente</option></select></div><button type="submit" class="btn" style="width:100%;">Ingresar</button></form><div style="margin-top:20px;padding:15px;background:#e3f2fd;border-radius:8px;"><p style="text-align:center;font-weight:600;color:#1976d2;">Usuarios de Prueba</p><p style="font-size:14px;color:#555;margin-top:10px;"><strong>Cobrador:</strong> cobrador1 / pass123</p><p style="font-size:14px;color:#555;"><strong>Admin:</strong> admin / admin123</p><p style="font-size:14px;color:#555;"><strong>Gerente:</strong> gerente / gerente123</p></div></div></div>';
                return;
            }

            const isAdmin = DATA.currentUser.role === 'administrador' || DATA.currentUser.role === 'gerente';
            const totalPrestado = DATA.prestamos.reduce((s, p) => s + p.monto, 0);
            const totalCobrar = DATA.prestamos.filter(p => p.activo).reduce((s, p) => s + p.total, 0);
            const totalCobrado = DATA.cobros.reduce((s, c) => s + c.monto, 0);

            let statsHTML = '';
            if (isAdmin) {
                statsHTML = '<div class="stats"><div class="stat-card"><h3>Total Prestado</h3><div class="value">$' + totalPrestado.toLocaleString() + '</div></div><div class="stat-card"><h3>Total a Cobrar</h3><div class="value">$' + totalCobrar.toLocaleString() + '</div></div><div class="stat-card"><h3>Total Cobrado</h3><div class="value">$' + totalCobrado.toLocaleString() + '</div></div></div>';
            }

            const clientes = getClientesFiltrados();
            const prestamos = getPrestamosFiltrados();
            const cobros = getCobrosFiltrados();

            let clientesHTML = '';
            for (let i = 0; i < clientes.length; i++) {
                const c = clientes[i];
                clientesHTML += '<tr><td>' + c.nombre + '</td><td>' + c.documento + '</td><td>' + c.telefono + '</td><td>' + c.direccion + '</td><td><button class="btn btn-small btn-danger" onclick="deleteCliente(' + c.id + ')">Eliminar</button></td></tr>';
            }

            let prestamosHTML = '';
            for (let i = 0; i < prestamos.length; i++) {
                const p = prestamos[i];
                const diasAtraso = calcularDiasAtraso(p);
                let badge = diasAtraso > 0 ? '<span class="badge badge-danger">Atrasado</span>' : '<span class="badge badge-success">Al día</span>';
                const pJSON = JSON.stringify(p).replace(/"/g, '&quot;');
                prestamosHTML += '<tr><td>' + p.cliente_nombre + '</td><td>$' + p.monto.toLocaleString() + '</td><td>$' + p.pendiente.toLocaleString() + '</td><td>' + badge + '</td><td><button class="btn btn-small btn-success" onclick=\'showModal("cobro", ' + pJSON + ')\'>Cobrar</button></td></tr>';
            }

            let cobrosHTML = '';
            for (let i = 0; i < cobros.length; i++) {
                const c = cobros[i];
                cobrosHTML += '<tr><td>' + c.fecha + '</td><td>' + c.cliente_nombre + '</td><td>$' + c.monto.toLocaleString() + '</td><td>' + c.cobrador_nombre + '</td></tr>';
            }

            app.innerHTML = '<div class="container"><div class="header"><div><h1>🏦 Sistema de Cobranza</h1><p style="opacity:0.9;margin-top:5px;">' + DATA.currentUser.nombre + '</p></div><button class="btn" onclick="logout()">Salir</button></div><div class="dashboard">' + statsHTML + '<div class="tabs"><button class="tab active" data-tab="clientes" onclick="showTab(\'clientes\')">Clientes</button><button class="tab" data-tab="prestamos" onclick="showTab(\'prestamos\')">Préstamos</button><button class="tab" data-tab="cobros" onclick="showTab(\'cobros\')">Cobros</button></div><div id="tab-clientes" class="tab-content active"><button class="btn" onclick="showModal(\'cliente\')" style="margin-bottom:20px;">+ Nuevo Cliente</button>' + (clientes.length > 0 ? '<table><thead><tr><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr></thead><tbody>' + clientesHTML + '</tbody></table>' : '<p style="text-align:center;padding:20px;">No hay clientes</p>') + '</div><div id="tab-prestamos" class="tab-content"><button class="btn" onclick="showModal(\'prestamo\')" style="margin-bottom:20px;">+ Nuevo Préstamo</button><div class="search-box"><input type="text" placeholder="Buscar..." value="' + DATA.searchTerm + '" oninput="updateSearch(this.value)"></div>' + (prestamos.length > 0 ? '<table><thead><tr><th>Cliente</th><th>Monto</th><th>Pendiente</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>' + prestamosHTML + '</tbody></table>' : '<p style="text-align:center;padding:20px;">No hay préstamos</p>') + '</div><div id="tab-cobros" class="tab-content">' + (cobros.length > 0 ? '<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Monto</th><th>Cobrador</th></tr></thead><tbody>' + cobrosHTML + '</tbody></table>' : '<p style="text-align:center;padding:20px;">No hay cobros</p>') + '</div></div></div><div id="modal" class="modal"><div class="modal-content" id="modalContent"></div></div>';
        }

        setTimeout(function() {
            console.log('✅ Renderizando...');
            render();
        }, 500);
    </script>
</body>
</html>
